# Reusable: the full local gate (lint, format, tests, build, infra typecheck/tests, synth).
# No AWS credentials and no id-token permission: tests can never reach AWS from here.
name: verify

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  NG_CLI_ANALYTICS: 'false'
  CI: 'true'

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/package-lock.json
      - run: npm ci
      - run: npm ci --prefix infra
      - run: npm run verify
      - name: Upload site build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-dist
          path: dist/word-study-tool/browser
          retention-days: 7
          if-no-files-found: error
